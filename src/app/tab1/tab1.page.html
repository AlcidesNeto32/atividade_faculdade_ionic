<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Ficha de Exame
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tab 1</ion-title>
    </ion-toolbar>
  </ion-header>

</ion-content>

<ion-card>
  <ion-card-header>
    <ion-input readonly="true" label = "Senha: " value = "{{senhas.inputNovaSenha}}"></ion-input>
  </ion-card-header>
  <ion-card-content>
    <ion-button expand="block" (click)="senhas.novaSenha('SG')">Senha Geral</ion-button>
    <ion-button expand="block" (click)="senhas.novaSenha('SP')">Senha Prioritária</ion-button>
    <ion-button expand="block" (click)="senhas.novaSenha('SE')">Senha Exame</ion-button>
  </ion-card-content>
</ion-card>
